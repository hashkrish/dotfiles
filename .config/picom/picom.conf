opacity-rule = [
  "90:class_g = 'firefox' && focused",
  "95:class_g = 'firefox' && !focused"
];

# Blur settings for macOS-like notifications
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;

vsync = true;

shadow-exclude = [
  "name = 'cpt_frame_xcb_window'",
  "class_g ?= 'zoom'",
];

blur-background-exclude = [
  "class_g ?= 'zoom'",
];

shadow-exclude = [
  "name = 'rect-overlay'",
];

blur-background-exclude = [
  "name = 'rect-overlay'",
];

