[general]
import = ["~/.config/alacritty/themes/dark.toml"]

[font]
size = 16.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "F11"

[keyboard.bindings.command]
args = ["-c", "wmctrl -ir $(xdotool getwindowfocus) -b toggle,fullscreen"]
program = "/bin/sh"

[window.padding]
x = 5
y = 5
